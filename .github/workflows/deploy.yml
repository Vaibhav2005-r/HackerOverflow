name: Deploy (Cloudflare Pages — free, HTTPS, unlimited bandwidth)
# One-time setup: create a Cloudflare Pages project named "raksha" (Direct Upload), then add repo secrets
#   CLOUDFLARE_API_TOKEN (Pages:Edit), CLOUDFLARE_ACCOUNT_ID, and repo variables/secrets VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY (publishable key),
#   VITE_ORS_KEY (optional), VITE_VAPID_PUBLIC_KEY (optional).
on:
  push: { branches: [main], paths: ["raksha/apps/**", "raksha/packages/**", ".github/workflows/deploy.yml"] }
  workflow_dispatch:
defaults: { run: { working-directory: raksha } }
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: { contents: read, deployments: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version comes from "packageManager" in raksha/package.json
        with: { package_json_file: raksha/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: raksha/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ORS_KEY: ${{ secrets.VITE_ORS_KEY }}
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY }}
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: raksha
          command: pages deploy apps/web/dist --project-name=raksha --branch=main
