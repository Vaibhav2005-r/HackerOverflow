name: Rebuild city packs
# Regenerates the safety packs from fresh OpenStreetMap data (monthly, or on demand for one city / all) and opens a PR.
on:
  schedule: [{ cron: "0 3 5 * *" }]
  workflow_dispatch:
    inputs:
      city: { description: "city id from raksha/pipeline/config/cities.yaml, or 'all'", default: all }
defaults: { run: { working-directory: raksha } }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4          # version comes from "packageManager" in raksha/package.json
        with: { package_json_file: raksha/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: raksha/pnpm-lock.yaml }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pnpm install --frozen-lockfile && pip install -r pipeline/requirements.txt
      - run: python -m raksha_pipeline.run --city "${{ inputs.city || 'all' }}"
        working-directory: raksha/pipeline
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: data/city-packs
          title: "Refresh city safety packs"
          commit-message: "data: refresh city packs from OpenStreetMap"
          body: "Generated by the city-packs workflow. Review the class distribution in each meta.json (Night Extra-care should stay roughly 5–25%) before merging."
