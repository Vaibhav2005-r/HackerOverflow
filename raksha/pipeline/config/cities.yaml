# bbox = [south, west, north, east]. `pbf` = the Geofabrik zone extract in data/raw/pbf/ (preferred source). Without it the pipeline
# falls back to public Overpass in ≤0.1° tiles cached in data/raw/<city>/ (slow and throttled — fine for a small area).
# Order = priority. Add a city here, run `pnpm pipeline:run -- --city <id>`, and it appears in public/data/index.json.
